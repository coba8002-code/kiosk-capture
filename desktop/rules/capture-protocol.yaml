# =============================================================================
#  현장 수집 프로토콜 — 촬영 세트 S1~S6 및 기준 스케일 마커 규격
#
#  이 파일은 수집 앱(PWA)의 촬영 체크리스트를 생성하고,
#  엔진이 "이 항목을 판정할 입력이 갖춰졌는가"를 판단하는 근거가 된다.
#
#  원칙 --------------------------------------------------------------------
#   1. 입력 품질이 판정 품질이다. 누락된 컷이 있으면 해당 항목은 판정하지 않고
#      '미판정(입력 부족)'으로 인쇄한다. 추정으로 메우지 않는다.
#   2. 치수 판정 항목은 마커 없이는 아예 계측을 시도하지 않는다.
#   3. 촬영물에는 이용객과 결제 정보가 들어온다. 업로드 전 단말에서 마스킹한다.
#
#  version: 0.1.0
#  updated: 2026-08-21
# =============================================================================

meta:
  version: "0.1.0"
  updated: "2026-08-21"
  rules_db: "annex5.yaml@0.1.0"

# -----------------------------------------------------------------------------
# 기준 스케일 마커 — 이 사업에서 가장 값싼 결정
# -----------------------------------------------------------------------------
marker:
  id: "BFK-MARK-A"
  form: "신용카드 크기 인쇄 카드"
  size_mm: { width: 85.6, height: 54.0 }
  pattern: "ArUco DICT_4X4_50, id 0~9"
  inner_square_mm: 40.0          # 마커 정사각 변 길이 (호모그래피 기준점)
  quiet_zone_mm: 4.0             # 마커 외곽 여백 (검출 안정성)
  print:
    material: "무광 코팅지 200g 이상"
    finish: "무광 필수 — 유광은 화면 반사와 겹쳐 검출률이 떨어진다"
    color: "흑백"
  usage:
    principle: >-
      호모그래피는 하나의 평면에 대해서만 성립한다. 화면 평면과 물리 버튼 평면은
      깊이가 다르므로 마커를 각 평면에 따로 두고 각각 별도로 환산한다.
    placements:
      - plane: display          # 화면 평면
        where: "디스플레이 베젤 위, 화면 영역을 가리지 않는 위치"
        used_by: ["3.g", "1.b(터치스크린)"]
      - plane: control_panel    # 물리 작동부 평면
        where: "키패드·물리 버튼과 같은 면"
        used_by: ["1.b(물리)", "1.c"]
      - plane: dispenser        # 배출구 평면
        where: "배출구 바로 옆, 배출물과 같은 깊이"
        used_by: ["1.i"]
      - plane: elevation        # 정면/측면 높이 기준
        where: "바닥에서 수직으로 세워 부착 (하단 모서리를 바닥면에 접지)"
        used_by: ["9.a", "9.b"]
  accuracy:
    expected_error_pct: 10        # 실증 전 목표. Q4 실측 대조로 교정한다.
    reject_if:
      - "마커 4점 중 하나라도 미검출"
      - "마커 평면과 대상 평면의 각도차가 큰 경우(왜곡 임계 초과)"
      - "마커 픽셀 폭이 프레임 폭의 3% 미만 (해상도 부족)"
    on_reject: "계측을 시도하지 않고 '미판정(마커 불량)'으로 처리한다"

# -----------------------------------------------------------------------------
# 촬영 세트
# -----------------------------------------------------------------------------
sets:

  - id: S1
    name: "화면 캡처 시퀀스"
    medium: photo
    required: true
    marker_plane: display
    shots:
      - id: S1-01
        label: "주요 플로우 전 단계 정면 촬영"
        note: "시작 화면부터 완료 화면까지 한 단계도 건너뛰지 않는다. 정면·무보정."
        repeat: "플로우 단계 수만큼"
        marker_required: true
        marker_plane: display
        marker_placement: "디스플레이 베젤 위에 붙이되 화면 내용은 가리지 않는다. 화면과 같은 방향으로 평평하게 둔다."
      - id: S1-02
        label: "문자 확대 상태 화면"
        note: "확대 기능을 켠 뒤 동일 화면을 다시 촬영. 없으면 '기능 없음'으로 기록."
        required_for: ["3.h"]
        marker_required: false
      - id: S1-03
        label: "고대비 모드 화면"
        note: "고대비 모드가 있으면 해당 상태 촬영. 없으면 '기능 없음'으로 기록."
        required_for: ["3.j"]
        marker_required: false
      - id: S1-04
        label: "원본 UI 이미지 파일"
        note: >-
          키오스크 제작사에서 받은 화면 원본, 스크린샷 또는 무보정 이미지 파일을
          갤러리·파일에서 선택한다. 여러 장을 한 번에 넣을 수 있다.
        required_for: ["3.i", "3.j"]
        input_mode: gallery
        multiple: true
        marker_required: false
    feeds: ["3.a", "3.d", "3.g", "3.h", "3.i", "3.j", "4.a", "5.a", "6.a", "7.a", "7.c", "7.d", "7.e", "7.f", "7.g", "7.h", "10.a", "1.b"]

  - id: S2
    name: "조작 영상"
    medium: video
    required: true
    marker_plane: null
    constraints:
      fps_min: 30
      note: "8.a 깜박임 3Hz 판정을 위해 30fps 이상. 24fps 이하는 판정 불가로 처리한다."
      audio: "동시 녹음 필수"
    shots:
      - id: S2-01
        label: "시작부터 완료까지 1회 연속 조작"
        note: "중간 끊김 없이 한 번에. 음성 안내가 들리도록 주변 소음을 최소화한다."
      - id: S2-02
        label: "제한 시간 대기 구간"
        note: "조작을 멈추고 타임아웃 경고가 뜰 때까지 기다린다. 이 컷이 없으면 2.b는 판정 불가."
        required_for: ["2.b"]
      - id: S2-03
        label: "자판·키패드 초점 이동"
        note: "키패드만으로 화면을 처음부터 끝까지 이동. 초점 표시가 보이도록."
        required_for: ["3.d", "3.e"]
      - id: S2-04
        label: "취소·이전 단계 조작"
        note: "진행 중 취소를 눌러 초기 상태로 돌아가는 과정."
        required_for: ["7.a", "7.d"]
    feeds: ["1.a", "2.a", "2.b", "3.c", "3.d", "3.e", "5.a", "5.b", "7.a", "7.b", "7.d", "8.a", "10.a", "1.i"]

  - id: S3
    name: "기기 사진"
    medium: photo
    required: true
    marker_plane: [control_panel, dispenser, elevation]
    shots:
      - id: S3-01
        label: "정면 전체 (마커 elevation 세움)"
        note: "바닥면이 프레임에 포함되도록. 마커 하단이 바닥에 닿아야 한다."
        required_for: ["9.a", "9.b"]
        marker_required: true
        marker_plane: elevation
        marker_placement: "기기 옆 바닥에 마커를 수직으로 세우고 카드 하단을 바닥에 정확히 맞춘다."
      - id: S3-02
        label: "측면 전체 (마커 elevation 세움)"
        note: "작동부 높이 추정의 주 입력."
        required_for: ["9.a"]
        marker_required: true
        marker_plane: elevation
        marker_placement: "기기 측면과 같은 거리에서 마커를 수직으로 세우고 하단을 바닥에 맞춘다."
      - id: S3-03
        label: "휠체어 눈높이 시점"
        note: "바닥에서 약 1,100mm 높이에서 화면을 바라본 컷. 화면 가림·반사 확인용."
        marker_required: false
      - id: S3-04
        label: "조작부 접사 (마커 control_panel)"
        note: "키패드·물리 버튼을 정면에서. 버튼 경계와 간격이 선명해야 한다."
        required_for: ["1.b", "1.c", "3.f", "3.k"]
        marker_required: true
        marker_plane: control_panel
        marker_placement: "키패드·물리 버튼 바로 옆의 같은 평면에 붙인다. 튀어나오거나 뒤로 들어간 면은 따로 촬영한다."
      - id: S3-05
        label: "투입구·배출구 접사 (마커 dispenser)"
        required_for: ["1.e", "1.i"]
        marker_required: true
        marker_plane: dispenser
        marker_placement: "투입구·배출구 바로 옆, 측정할 부분과 같은 깊이의 면에 붙인다."
      - id: S3-06
        label: "하부 공간 (무릎·발 공간)"
        note: "하부 개방 구조인 경우. 마커를 바닥에 눕혀 깊이 기준을 만든다."
        marker_required: true
        marker_plane: floor
        marker_placement: "기기 아래 바닥에 마커를 평평하게 눕혀 무릎·발 공간과 함께 찍는다."
      - id: S3-07
        label: "스캐너·지문 인식 장치 접사"
        note: "해당 장치가 있는 경우에만."
        required_for: ["1.g", "1.h"]
        marker_required: false
    feeds: ["1.b", "1.c", "1.e", "1.g", "1.h", "1.i", "3.b", "3.f", "3.k", "7.e", "9.a", "9.b"]

  - id: S4
    name: "주변 환경"
    medium: photo
    required: true
    marker_plane: null
    shots:
      - id: S4-01
        label: "기기 전면 활동공간 (마커 바닥 배치)"
        marker_required: true
        marker_plane: floor
        marker_placement: "기기 앞 활동공간 바닥에 마커를 평평하게 놓고, 마커와 활동공간 전체가 함께 보이게 찍는다."
      - id: S4-02
        label: "접근 경로 — 출입구에서 기기까지"
        marker_required: false
        note: "마커 없이 출입구부터 기기까지 경로 전체가 이어져 보이게 촬영한다."
      - id: S4-03
        label: "바닥 단차·경사 근접"
        marker_required: false
        note: "근접 사진과 전체 위치 사진을 함께 찍는다. 높이·경사 수치가 필요하면 줄자·경사계로 별도 실측한다."
      - id: S4-04
        label: "화면 눈부심·반사 상태"
        note: "촬영 시각과 조명 상태를 함께 기록한다. 시간대에 따라 결과가 달라진다."
        marker_required: false
        metadata:
          - { key: captured_at, label: "촬영 시각", type: auto, required: true }
          - { key: lighting, label: "조명 상태", type: select, required: true, options: ["실내 조명", "자연광", "직사광", "역광", "혼합광", "기타"] }
          - { key: reflection, label: "반사 정도", type: select, required: true, options: ["거의 없음", "약함", "화면 일부 가림", "내용 확인 어려움"] }
          - { key: illuminance_lux, label: "조도(lux, 선택)", type: number, required: false }
          - { key: note, label: "광원 위치·특이사항", type: text, required: false }
    feeds: []
    note: >-
      S4가 먹이는 항목은 별표5 40항목에 직접 대응되지 않는다.
      설치 환경은 KS 11절 영역이며, 개선 처방(OPS)과 2차년도 확장을 위해 수집한다.

  - id: S5
    name: "음성 녹음"
    medium: audio
    required: true
    marker_plane: null
    shots:
      - id: S5-01
        label: "스피커 출력 — 최소 음량"
      - id: S5-02
        label: "스피커 출력 — 최대 음량"
      - id: S5-03
        label: "개인청취장치(이어폰) 연결 상태"
        note: "연결 즉시 스피커가 멈추는지 귀로 확인하고 점주 문항에 답한다."
        required_for: ["3.b"]
      - id: S5-04
        label: "개인정보 안내 구간"
        note: >-
          민감정보 음성 여부 확인용. 이 녹음에는 개인정보가 담기므로
          업로드 전 마스킹하고, 전사 원문은 저장하지 않는다.
        required_for: ["10.b"]
    feeds: ["1.g", "3.a", "3.b", "3.c", "3.k", "5.a", "5.b", "5.c", "7.b", "10.b"]

  - id: S6
    name: "설치 매뉴얼"
    medium: document
    required: false
    marker_plane: null
    shots:
      - id: S6-01
        label: "납품사 제공 설치 매뉴얼 PDF"
        note: "제출된 경우에만 분석한다. 미제출은 '해당 없음'이 아니라 '미제출'로 기록한다."
    feeds: []
    note: "설치 기준 기재 여부 분석용. 점주 체크리스트 '설치 매뉴얼 제공 여부'와 연동한다."

# -----------------------------------------------------------------------------
# 개인정보 처리 — 수집 단계에서 강제한다
# -----------------------------------------------------------------------------
privacy:
  on_device_masking:
    enabled: true
    targets:
      - { kind: face,        action: blur,   note: "이용객·직원 얼굴" }
      - { kind: card_number, action: redact, note: "화면·실물 카드 번호" }
      - { kind: id_number,   action: redact, note: "주민등록번호 등" }
      - { kind: name,        action: redact, note: "화면 표시 성명" }
    timing: "업로드 전, 단말에서 수행한다. 원본은 서버로 전송하지 않는다."
  audio:
    store_transcript: false
    note: "S5 전사는 패턴 탐지 결과(있음/없음 + 유형)만 남기고 원문은 폐기한다."
  consent:
    required: true
    note: "촬영 시작 전 앱에서 매장 촬영 동의 절차를 거친다."

# -----------------------------------------------------------------------------
# 제출 게이트 — 이 조건을 만족해야 진단이 시작된다
# -----------------------------------------------------------------------------
submission_gate:
  block_if:
    - "required: true 인 세트에 필수 컷이 하나라도 없는 경우"
    - "marker_required 항목을 판정하려는데 해당 평면의 마커가 검출되지 않은 경우"
    - "S2 fps가 30 미만인 경우 (8.a 판정 불가로 표시하고 진행은 허용)"
  on_partial:
    action: proceed
    note: >-
      부분 제출도 진단은 진행한다. 다만 입력이 없는 항목은 '미판정(입력 부족)'으로
      리포트에 명시하고, 어떤 컷을 추가로 찍으면 판정 가능한지 함께 인쇄한다.
