# 사용성 주의 — 기준은 통과하나 고령·근골격 제한 사용자에게 부담인 구간
#
# ────────────────────────────────────────────────────────────────────────
# 이 파일은 **별표5가 아니다.**
#
# 별표5는 적합/부적합(+8항목의 우수/보통)만 정한다. 여기 적힌 구간은 법정
# 판정이 아니며, 어떤 항목의 판정도 바꾸지 않는다. 리포트에 '참고'로만 실린다.
# 별표5가 아닌 것을 annex5.yaml 에 섞지 않으려고 파일을 나눴다.
#
# 어디서 나왔나
#   2026-08-22 합동 평가. 정형외과 전문의가 지적한 것:
#     · 9.a 의 400~1,220mm 는 도달 **가능** 범위다. 어깨 굴곡 제한
#       (유착성 관절낭염·회전근개 병변)이 있는 고령자에게 상단은
#       도달은 되지만 통증을 동반하거나 자세 유지가 어렵다.
#     · 1.b 의 2.5mm 는 본태성 진전·파킨슨 환자의 손 떨림 진폭보다 작다.
#       기준을 지켜도 오입력이 난다.
#   그리고 생활체육인 70대가 지적한 것:
#     · 7.25mm 는 시력검사 란돌트 고리에서 산출된 값이다. 실제 키오스크는
#       40~60cm 에서 보고, 노안이 진행되면 더 물러서서 본다.
#
# 숫자를 어떻게 정했나 — 정직하게
#   **임상 근거로 확립된 경계값이 아니다.** 기준선 바로 위 구간을 '여유가 없다'고
#   보고 표시하기 위한 실무 기준이다. 그래서 코드에 숨기지 않고 이 파일에 드러냈다.
#   실증 현장에서 반증되면 여기 숫자를 고치면 된다. 고치면 리포트가 따라 바뀐다.
#
#   판정을 바꾸지 않으므로, 이 숫자가 틀려도 법적 판정은 틀어지지 않는다.
#   과도하게 표시되면 검토자가 무시하면 되고, 적게 표시되면 놓칠 뿐이다.
#   그 비대칭이 이 기능을 안전하게 만든다.
# ────────────────────────────────────────────────────────────────────────

meta:
  version: "0.1.0"
  updated: "2026-08-22"
  source: "합동 평가 회차 1 — 정형외과 전문의·고령 이용자 의견"
  legal_status: "별표5 아님. 판정을 바꾸지 않는 참고 정보."

items:
  - id: "9.a"
    measured_key: "결제 모듈 높이"
    label: "도달 높이"
    # 별표5: 400 ~ 1,220mm. 상·하단 끝은 도달 '가능' 범위의 경계다.
    caution:
      above_mm: 1100
      below_mm: 500
    why: >-
      어깨를 1,100mm 위로 올려 자세를 유지하는 동작은 유착성 관절낭염·회전근개
      병변이 있는 고령자에게 통증을 동반합니다. 500mm 아래는 허리를 굽혀야 합니다.
      기준은 통과하지만 실사용에서 포기가 생길 수 있는 높이입니다.
    advice: "다음 발주 때 600~1,100mm 구간에 주요 작동부를 두도록 요청하세요."

  - id: "1.b"
    measured_key: "최소 간격"
    label: "버튼 간격"
    # 별표5: 터치 2.5mm / 물리 0.5mm 이상
    caution:
      below_mm: 5.0
    why: >-
      본태성 진전이나 파킨슨병이 있는 사용자의 손 떨림 진폭은 2.5mm 를 넘습니다.
      기준을 지켜도 옆 버튼이 눌리는 오입력이 납니다.
    advice: "화면 배치를 바꿀 수 있다면 주요 버튼 사이를 5mm 이상 띄우세요."

  - id: "1.c"
    measured_key: "최소 변"
    label: "버튼 크기"
    # 별표5: 각 변 12mm 이상
    caution:
      below_mm: 15.0
    why: >-
      12mm 는 손끝이 정확히 닿는 것을 전제한 최솟값입니다. 떨림이나 감각 저하가
      있으면 조준이 어렵고, 장갑을 낀 상태에서도 마찬가지입니다.
    advice: "주요 버튼은 15mm 이상으로 키우면 오조작이 눈에 띄게 줄어듭니다."

  - id: "3.g"
    measured_key: "최소 문자 높이"
    label: "문자 높이"
    # 별표5: 7.25mm 이상
    caution:
      below_mm: 9.0
    why: >-
      7.25mm 는 시력검사 란돌트 고리에서 산출된 값입니다. 실제 키오스크는
      40~60cm 거리에서 보며, 노안이 진행된 사용자는 더 물러서서 봅니다.
      기준을 겨우 넘긴 크기는 실사용 거리에서 읽기 어려울 수 있습니다.
    advice: "문자 확대(3.h)가 되는지 함께 확인하세요. 되면 급하지 않습니다."
