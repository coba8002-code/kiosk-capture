# =============================================================================
#  전문 실측 SOP — Track C 7항목
#
#  이 파일은 계측 업체에 그대로 전달하는 작업 지시서이자,
#  리포트에 함께 인쇄되는 측정 조건의 원본이다.
#
#  왜 SOP 가 필요한가 --------------------------------------------------------
#   측정 조건이 없는 수치는 재현되지 않는다. 그리고 표준은 생각보다 많은 것을
#   비워 두었다. 아래 provenance 필드가 각 조건의 출처를 밝힌다.
#     standard  — 표준이 직접 규정한 값
#     derived   — 표준의 다른 조항에서 도출한 값
#     sop       — 표준이 비워 두어 본 SOP 가 정의한 값 ← 리포트에 반드시 병기
#
#  version: 0.1.0
#  updated: 2026-08-22
# =============================================================================

meta:
  version: "0.1.0"
  updated: "2026-08-22"
  rules_db: "annex5.yaml@0.1.0"
  scope: "별표5 Track C 7항목 (1.c · 1.d · 1.i · 3.g · 5.c · 9.a · 9.b)"

# -----------------------------------------------------------------------------
# 공통 조건
# -----------------------------------------------------------------------------
common:
  environment:
    temperature_c: "20 ± 5"
    note: "온도는 힘 계측(고무·스프링 특성)과 음향 계측에 영향을 준다"
  repeats: 3
  aggregation: "산술평균. 3회 중 최대·최소 차이가 평균의 10% 를 넘으면 5회로 늘린다"
  record:
    - 측정 일시
    - 측정자 · 소속
    - 장비 모델 · 교정 유효기간
    - 각 회차 원시값
    - 판정값과 산출 방법
  principle: >-
    실측값은 AI 추정값을 '확인'하는 것이 아니라 '대체'한다.
    두 값이 다르면 실측값이 이긴다. AI 추정값은 참고로만 병기한다.

# -----------------------------------------------------------------------------
# 항목별 SOP
# -----------------------------------------------------------------------------
items:

  - id: "1.c"
    name: "작동부 최소경계상자"
    instrument: "디지털 캘리퍼 (0.01mm 분해능)"
    criteria:
      - { what: "경계상자 각 변", value: "12mm 이상", provenance: standard, source: "별표5 1.c" }
      - { what: "경계상자 면적", value: "144mm² 이상", provenance: standard, source: "별표5 1.c" }
      - { what: "누름 부위 면적", value: "150mm² 이상", provenance: standard, source: "KS X 9211:2025 §5.6.2 — 권고", judgment: false }
    procedure:
      - 기기 축에 정렬된 상태에서 잰다. 버튼이 비스듬히 배치돼 있어도 기기 축 기준이다.
      - 경계상자는 누를 수 있는 영역 전체를 감싸는 최소 직사각형이다.
      - 원형·다각형 버튼은 누름 부위 면적을 따로 계산한다(지름 또는 대각 치수로).
      - 동일 형상 버튼이 반복되면 대표 3개를 재고 편차가 0.2mm 이내면 대표값을 쓴다.
    note: >-
      경계상자 면적(별표5)과 누름 부위 면적(KS)은 다른 값이다. 둘 다 기록한다.
      지름 12mm 원형 버튼은 경계상자 144mm² 로 별표5를 통과하지만
      누름 면적은 113mm² 라 KS 권고에는 못 미친다.

  - id: "1.d"
    name: "작동부 조작력"
    instrument: "푸시풀 게이지 (0.1N 분해능, 피크홀드 기능)"
    criteria:
      - { what: "누르기·당기기·밀기 조작력", value: "22.2N (2.26kgF) 이하", provenance: standard, source: "별표5 1.d" }
    procedure:
      - 버튼 중앙에 수직으로 힘을 가한다. 비스듬히 누르면 값이 커진다.
      - 피크홀드로 '작동이 인식되는 순간'의 힘을 읽는다. 끝까지 누른 힘이 아니다.
      - 카드 삽입·회수, 레버, 손잡이도 모두 대상이다.
      - 가장 큰 값을 판정값으로 쓴다.
    note: "촬영물로는 어떤 추정도 하지 않는다. AI 추정값 없음."

  - id: "1.i"
    name: "배출 매체 돌출 길이 및 인출력"
    instrument: "강철자 (0.5mm 눈금) + 푸시풀 게이지"
    criteria:
      - { what: "낱장 매체 돌출 길이", value: "20mm 이상", provenance: standard, source: "별표5 1.i" }
      - { what: "인출에 필요한 힘", value: "22.2N 이하", provenance: derived, source: "별표5 1.d 의 조작력 기준을 배출물 인출에 적용" }
    procedure:
      - 실제 영수증 용지로 3회 배출해 배출구 바깥으로 나온 길이를 잰다.
      - 매체가 파손되지 않고 뽑히는지, 한 손으로 가능한지 함께 기록한다.
      - 여러 장 배출이면 받침대에 담기는지, 튕겨 나가는지를 기록한다.

  - id: "3.g"
    name: "문자 높이"
    instrument: "디지털 캘리퍼 또는 눈금 확대경 (0.1mm)"
    criteria:
      - { what: "필수 문자의 문자 높이", value: "7.25mm 이상", provenance: standard, source: "별표5 3.g" }
    procedure:
      - 화면에 표시된 상태 그대로 잰다. 확대 기능을 켜지 않는다.
      - '문자 높이'는 글자 잉크의 실제 높이다. 행간·여백을 포함하지 않는다.
        (KS §5.2.3 비고 3 — 란돌트 고리 직경 기준)
      - 한글은 네모틀 자소의 상단~하단, 라틴 대문자는 캡 하이트를 잰다.
      - 비디오 캡션은 대상에서 제외한다(별표5 3.g 단서).
      - 화면에서 가장 작은 필수 문자를 찾아 재고, 그 값을 판정값으로 쓴다.
    note: >-
      AI 추정값(calc/text_height.py)은 폰트 메트릭 계수로 환산한 값이다.
      실측값과 함께 기록해 계수 교정 표본으로 쓴다 — OCR 상자 규약 성분이
      아직 미교정이므로, 이 표본이 그 교정의 입력이 된다.

  - id: "5.c"
    name: "스피커 음량"
    instrument: "적분형 소음계 (A특성, FAST, Class 2 이상, 교정 유효)"
    criteria:
      - { what: "최대 조절 가능 음량", value: "65dBA 이상", provenance: standard, source: "별표5 5.c · KS §5.3.3 b) · EN 301 549 §5.1.3.12" }
      - { what: "음소거 수단", value: "제공", provenance: standard, source: "별표5 5.c · KS §5.3.3 c)" }
      - { what: "사용 후 자동 초기화", value: "65dBA 미만", provenance: standard, source: "별표5 5.c · KS §5.3.4 · EN 301 549 §5.1.3.13" }
      - { what: "음량 조절 범위", value: "18dB 이상", provenance: standard, source: "EN 301 549 §8.2.1.1 — 권고", judgment: false }
      - { what: "단계식 제어의 중간 단계", value: "최저 대비 +12dB 이상", provenance: standard, source: "EN 301 549 §8.2.1.2 — 권고", judgment: false }
    measurement_point:
      provenance: sop
      why: >-
        별표5·KS X 9211 §5.3.3·EN 301 549 §5.1.3.12 어디에도 측정 거리 규정이 없다.
        EN 의 "-29 dBPaA" 는 음압 기준점(65dB SPL re 20µPa)을 고정할 뿐 측정 지점을
        정하지 않는다. 따라서 본 SOP 가 정의하고 리포트에 병기한다.
      distance_mm: 300
      distance_from: "기기 전면(사용자가 서는 쪽)"
      heights_mm:
        standing: 1500       # 선 자세 귀 높이 근사
        wheelchair: 1150     # 휠체어 착석 귀 높이 근사
      verdict_rule: "두 측정점 중 낮은 값을 판정값으로 한다 (보수적)"
      axis: "화면 중앙 정면"
    procedure:
      - 음량을 최대로 올린 뒤 안내 음성을 재생하며 등가소음도(LAeq)를 잰다.
      - 두 높이에서 각각 3회 측정해 평균한다.
      - 측정 직전·직후에 암소음을 같은 지점에서 잰다.
      - 세션을 정상 종료시킨 뒤 다시 재생해 초기화 음량을 잰다.
      - 최저 음량과 단계식 제어의 중간 단계도 재어 권고 항목을 기록한다.
    background_noise:
      provenance: sop
      rule: |
        ΔL = 측정값 − 암소음
        ΔL ≥ 10dB   보정 불필요
        3 ≤ ΔL < 10 보정 적용:  L = 10·log10(10^(Lm/10) − 10^(Lb/10))
        ΔL < 3dB    측정 무효 — 조용한 시간대에 재측정
      note: "일반 음향 계측 관례(ISO 3744 계열). 표준이 규정한 값이 아니다."

  - id: "9.a"
    name: "작동부 높이"
    instrument: "레이저 거리계 또는 강철 줄자 (1mm 눈금)"
    criteria:
      - { what: "모든 작동부의 바닥으로부터 높이", value: "400mm 이상 1,220mm 이하", provenance: standard, source: "별표5 9.a" }
    procedure:
      - 마감된 바닥면을 기준으로 한다. 받침대·매트가 있으면 그 위가 아니라 바닥이다.
      - 작동부의 조작 중심(누르는 지점)을 기준으로 잰다.
      - 가장 높은 작동부와 가장 낮은 작동부를 모두 기록한다.
      - 경계값(400·1,220mm) ±30mm 구간은 반드시 3회 측정한다.
    note: "AI 추정값은 마커 기준 ±10% 목표. 경계 근처는 추정으로 판정하지 않는다."

  - id: "9.b"
    name: "시각 정보 상단 높이"
    instrument: "레이저 거리계 또는 강철 줄자 (1mm 눈금)"
    criteria:
      - { what: "화면상 필수 시각 정보의 최상단 높이", value: "1,400mm 이하", provenance: standard, source: "별표5 9.b" }
    procedure:
      - 화면에 실제로 표시되는 필수 정보의 가장 위쪽 픽셀 위치를 기준으로 한다.
      - 베젤이나 케이스 상단이 아니다. 표시 영역 기준이다.
      - 주요 플로우의 모든 화면에서 가장 높은 지점을 찾아 판정값으로 쓴다.

# -----------------------------------------------------------------------------
# 리포트 병기 — 이 문구가 측정값과 함께 인쇄된다
# -----------------------------------------------------------------------------
report_disclosure:
  required: true
  template: >-
    측정 조건 — {instrument} / {condition}.
    {provenance_note}
  provenance_notes:
    standard: "표준이 규정한 조건입니다."
    derived: "표준의 관련 조항에서 도출한 조건입니다."
    sop: >-
      해당 표준(별표5·KS X 9211·EN 301 549)에 측정 조건 규정이 없어
      본 진단 SOP 가 정의한 조건입니다. 다른 조건으로 측정하면 값이 달라질 수 있습니다.
