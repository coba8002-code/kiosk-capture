          음성 입력을 요구하는 경우, 음성 입력을 대체할 수 있는 수단이 제공되어야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S1, S2]
        marker_required: false
        params: {}
        ks_ref: ["KS X 9211:2025 §6", "트리아지 원본 8행"]
        triage_ref: "발성을 요구하지 않는 대체 입력 방식 (UI Flow AI + Vision AI + OCR) / 원본 8행"
        remedy: { type: SW, difficulty: 중간, cost_band: 2 }

  # ===========================================================================
  - area: 7
    name: "인지능력 보완"
    items:

      - id: "7.a"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "언제든 취소하고 되돌릴 수 있어야 하며, 넣은 물건을 돌려받아야 합니다"
        criterion: >-
          사용자가 언제든지 입력 또는 실행을 취소하거나, 이전 단계 또는 초기 상태로
          되돌릴 수 있어야 한다. 또한, 이전 단계나 초기 상태로 되돌릴 때는 입력된 정보가
          삭제되어야 하고 삽입된 카드, 지폐, 동전, 상품권, 고지서 등을 회수할 수 있어야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: fail_only
        final_by: REVIEWER
        evidence: [S1, S2]
        marker_required: false
        params: {}
        ks_ref: ["KS X 9211:2025 §6", "트리아지 원본 82~86행"]
        triage_ref: "제한 시간·연장·초기화 기능 (UI Flow AI) / 원본 82~85행"
        remedy: { type: SW, difficulty: 중간, cost_band: 2 }
        notes: "매체 회수 동작은 실물 투입이 필요하므로 적합 확정은 검토자가 점주 확인과 함께 내린다."

      - id: "7.b"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "버튼을 누르면 화면뿐 아니라 소리나 진동으로도 반응해야 합니다"
        criterion: >-
          사용자 조작에 대한 반응은 시각 방식과 함께 청각 또는 촉각 방식이 제공되거나
          청각과 촉각을 병행한 방식이 제공되어야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S2, S5]
        marker_required: false
        params: {}
        ks_ref: ["KS X 9211:2025 §6", "트리아지 원본 79~80행"]
        triage_ref: "조작 피드백 및 오류 안내 (Vision AI + Speech AI + UI Flow AI) / 원본 79~80행"
        remedy: { type: SW, difficulty: 낮음, cost_band: 1 }

      - id: "7.c"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "화면 구성이 단순하고, 화면마다 같은 자리에 있어야 합니다"
        criterion: >-
          모든 설계 요소는 사용자가 논리적으로 쉽게 이해할 수 있도록 단순하고
          일관성 있게 배치되어야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S1]
        marker_required: false
        params: {}
        detect:
          method: "화면 간 동일 기능 요소의 위치·레이블·형태 일관성 대조"
        ks_ref: ["KS X 9211:2025 §6", "트리아지 원본 75~76행"]
        triage_ref: "UI 일관성 및 논리적 구성 (Vision AI + UI Flow AI) / 원본 75~76행"
        remedy: { type: SW, difficulty: 중간, cost_band: 2 }

      - id: "7.d"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "화면이 바뀐 것을 알 수 있고, 이전 화면으로 돌아갈 수 있어야 합니다"
        criterion: >-
          화면 전환이나 새로운 이벤트는 사용자가 현재 상태를 인지할 수 있는 방식으로
          제공되어야 하며, 기존 화면으로 되돌릴 수 있는 방법이 제공되어야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S1, S2]
        marker_required: false
        params: {}
        ks_ref: ["KS X 9211:2025 §6", "트리아지 원본 86행"]
        triage_ref: "이전 단계 이동 기능 (AI 권유사항) / 원본 86행"
        remedy: { type: SW, difficulty: 낮음, cost_band: 1 }

      - id: "7.e"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "도움을 요청할 연락처나 직원 호출 버튼이 있어야 합니다"
        criterion: >-
          사용자가 도움을 요청할 수 있도록 연락처를 명시하거나 직원을 호출할 수 있는
          기능을 제공하여야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S1, S3]
        marker_required: false
        params: {}
        ks_ref: ["KS X 9211:2025 §10"]
        triage_ref: "사용 방법의 시각·비시각 안내 / 원본 96행"
        remedy: { type: OPS, difficulty: 낮음, cost_band: 1 }
        notes: "화면 내 호출 버튼뿐 아니라 기기 표면 인쇄물·안내판도 인정되므로 S3를 함께 본다."

      - id: "7.f"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "그림 기호만 쓰지 말고 글자를 함께 적어야 합니다"
        criterion: >-
          기호로 표시된 정보는 문자와 함께 제공되어야 한다. 다만 국제표준·국가표준으로
          정하거나 실생활에서 일반적으로 사용되어 일반인이 그 의미를 명확히 인식할 수 있는
          기호의 경우에는 예외로 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S1]
        marker_required: false
        params:
          exempt_symbols: ["국제표준 기호", "국가표준 기호", "실생활 통용 기호"]
        ks_ref: ["KS X 9211:2025 §6", "트리아지 원본 89행"]
        triage_ref: "텍스트와 그림·아이콘 병행 제공 (AI 권유사항) / 원본 89행"
        remedy: { type: SW, difficulty: 낮음, cost_band: 1 }
        notes: "예외 기호 판단은 확신도가 낮게 나오기 쉽다. 검토자 큐로 넘어갈 확률이 높은 항목."

      - id: "7.g"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "누를 수 있는 버튼과 그냥 글씨가 확실히 구별되어야 합니다"
        criterion: >-
          기능이 부여된 작동부는 그 기능을 명확히 파악할 수 있어야 하고 기능이 부여되지
          않은 문자나 이미지 등과 명확히 구별되어야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S1]
        marker_required: false
        params: {}
        ks_ref: ["KS X 9211:2025 §5.2.6", "트리아지 원본 61~62행"]
        triage_ref: "콘텐츠 및 조작 가능한 UI 구분 (Vision AI) / 원본 61~62행"
        remedy: { type: SW, difficulty: 낮음, cost_band: 1 }

      - id: "7.h"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "어려운 한자어나 외래어 대신 쉬운 말을 써야 합니다"
        criterion: >-
          문자 정보는 어려운 관용구나 외래어의 사용을 지양하고 사용자가 이해하기 쉬운
          용어를 사용하여야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S1]
        marker_required: false
        params: {}
        detect:
          method: "OCR 추출 문구를 LLM이 평가 — 전문용어·관용구·불필요한 외래어·문장 길이"
        ks_ref: ["KS X 9211:2025 §6", "트리아지 원본 87~88행"]
        triage_ref: "간결하고 단순한 언어 사용 (LLM 자연어 처리) / 원본 87~88행"
        remedy: { type: SW, difficulty: 낮음, cost_band: 1 }

  # ===========================================================================
  - area: 8
    name: "깜박임 사용 제한"
    items:

      - id: "8.a"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "화면이 1초에 3번 이상 깜박이면 안 됩니다"
        criterion: >-
          화면이나 장치에서 발생하는 깜박임은 초당 3회 미만으로 제한되어야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: measure
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S2]
        marker_required: false
        params:
          flash_max_per_sec: 3
          comparison: "미만"
        logic_ref: "calc/flash_rate.py"
        capture_note: "S2는 30fps 이상으로 촬영한다. 24fps 이하면 3Hz 판정의 여유가 부족하다."
        ks_ref: ["KS X 9211:2025 §5.2.7", "트리아지 원본 33행"]
        triage_ref: "광과민성 발작 방지 (Video Analysis AI) / 원본 33행"
        remedy: { type: SW, difficulty: 낮음, cost_band: 1 }

  # ===========================================================================
  - area: 9
    name: "휠체어 사용자 접근"
    items:

      - id: "9.a"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "모든 버튼이 바닥에서 40cm ~ 122cm 사이에 있어야 합니다"
        criterion: >-
          모든 작동부는 바닥으로부터 400mm ~ 1,220mm 사이에 있어야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: C_MEASURE
        ai_role: measure
        ai_verdict_scope: fail_only
        final_by: MEASURE
        evidence: [S3]
        marker_required: true
        params: { height_min_mm: 400, height_max_mm: 1220 }
        logic_ref: "calc/reach_height.py"
        instrument: "줄자 / 레이저 거리계"
        ks_ref: ["KS X 9211:2025 §11", "트리아지 원본 44행"]
        triage_ref: "조작부 높이 및 휠체어 도달 범위 (전문 실측 필수) / 원본 44행·실측"
        remedy: { type: OPS, difficulty: 높음, cost_band: 3 }
        exemptible_by: [무인민원발급기_표준규격]
        notes: >-
          측면 촬영에 마커를 세워 두면 ±20mm 수준까지 추정할 수 있다.
          경계값(400·1,220mm) 부근은 반드시 실측으로 확정한다.

      - id: "9.b"
        scope: 기본
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "화면의 중요한 내용이 바닥에서 140cm를 넘지 않아야 합니다"
        criterion: >-
          화면 상 모든 필수적인 시각적 정보는 바닥으로부터 1,400mm를 넘지 않아야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: C_MEASURE
        ai_role: measure
        ai_verdict_scope: fail_only
        final_by: MEASURE
        evidence: [S3]
        marker_required: true
        params: { height_max_mm: 1400 }
        logic_ref: "calc/reach_height.py"
        instrument: "줄자 / 레이저 거리계"
        ks_ref: ["KS X 9211:2025 §11", "트리아지 원본 41행"]
        triage_ref: "디스플레이 시인성 분석 (Vision AI) / 원본 41행"
        remedy: { type: OPS, difficulty: 높음, cost_band: 3 }

  # ===========================================================================
  - area: 10
    name: "개인정보 보호"
    items:

      - id: "10.a"
        scope: 개인정보 입력
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "지문·홍채 말고 다른 인증 방법도 고를 수 있어야 합니다"
        criterion: >-
          사용자 식별이 필요한 경우, 지문·홍채 인식 등 생체 인식 이외의 선택 가능한
          대체 인증 수단을 제공하여야 한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: both
        final_by: REVIEWER
        evidence: [S1, S2]
        marker_required: false
        params:
          non_biometric_examples: ["아이디+비밀번호", "전자인증서", "휴대전화 본인인증"]
        ks_ref: ["KS X 9211:2025 §9.2", "트리아지 원본 91행"]
        triage_ref: "생체인식 대체 수단 제공 (UI Flow AI) / 원본 91행"
        remedy: { type: SW, difficulty: 중간, cost_band: 2 }

      - id: "10.b"
        scope: 개인정보 입력
        applies_to: [중대형, 소형]
        # 점주용 리포트에 쓰는 쉬운 말. 원문은 아래 criterion 그대로 남는다.
        plain: "개인정보를 스피커로 읽어 주면 안 됩니다 (이어폰은 예외)"
        criterion: >-
          개인정보는 음성으로 읽어주어서는 안된다. 다만, 개인청취장치를 연결한 경우는
          제외한다.
        verdict: { base: 적합/부적합, grade: null }
        track: A_AI
        ai_role: judge
        ai_verdict_scope: fail_only
        final_by: REVIEWER
        owner_check: true
        evidence: [S5]
        marker_required: false
        params: {}
        detect:
          method: "S5 미연결 녹음의 STT 전사에서 개인정보 패턴(성명·주민번호·카드번호·전화번호) 탐지"
        owner_question: >-
          민감한 정보를 음성으로 안내하는 중에 이어폰을 뽑으면, 그 소리가 외부 스피커로
          넘어가지 않고 멈춥니까? (예 / 아니오 / 해당 없음)
        ks_ref: ["KS X 9211:2025 §9.3.3", "트리아지 원본 58·94행"]
        triage_ref: "개인청취장치 연결·분리 시 음성 출력 차단 (점주 체크리스트 필수) / 원본 58·94행"
        remedy: { type: SW, difficulty: 중간, cost_band: 2 }
        notes: >-
          S5 녹음 자체에 개인정보가 담긴다. 업로드 전 단말에서 마스킹하고,
          전사 결과는 패턴 탐지 결과만 남기고 원문을 저장하지 않는다.
          (BUILD_SPEC §9 개인정보 처리 원칙)

# -----------------------------------------------------------------------------
# 별표5 2. 사용자 검증 기준 — Track D
#   이 룰 DB는 사용자 검증을 판정하지 않는다. 실증 설계의 정답지로만 사용한다.
# -----------------------------------------------------------------------------
user_validation:
  track: D_USER
  ai_replaceable: false
  note: "실험실 환경에서 준비된 시나리오로 주요 기능을 검증한다. 어떤 촬영·계측으로도 대체되지 않는다."

  composition:
    - { type: "비장애인(20~40대)",        min_count: 3 }
    - { type: "전맹시각장애인",            min_count: 2 }
    - { type: "저시력시각장애인",          min_count: 2 }
    - { type: "휠체어사용 상지지체장애인", min_count: 1 }
    - { type: "휠체어사용 뇌병변장애인",   min_count: 1 }
    - { type: "청각·언어장애인",           min_count: 1 }
    - { type: "고령자(65세 이상)",         min_count: 2 }
  total_min_count: 12

  metrics:
    - id: 효과성
      question: "무인정보단말기의 주요 기능을 모두 완수할 수 있는가?"
      method: "총 시나리오 개수 중에서 최종 완수한 작업의 비율로 계산"
      followup: "완수하지 못하는 작업에 대해 평가지침에 기반한 문제점 확인 필요"
    - id: 효율성
      question: "무인정보단말기의 주요 기능을 수행하는 데에 요구되는 노력이 과도하지 않은가?"
      method: >-
        각 시나리오에 소요되는 시간을 측정, 비장애인 사용자의 평균 작업 완료 시간과 비교,
        비장애인 대비 3배 이상 오래 걸리는 작업의 비율을 계산
      followup: "3배 이상 오래 걸리는 작업에 대해 평가지침에 기반한 문제점 확인 필요"
    - id: 만족도
      question: "무인정보단말기의 주요 기능을 수행하는 데에 있어서 접근성이 만족스러운가?"
      method: "각 작업마다 5점 척도로 측정하여 전체 평균을 계산"
      followup: "평균 3점 미만 작업에 대해 문제점 확인 및 인터뷰 조사 필요"

  poc_reduced_panel:
    note: >-
      1차년도 예산으로 12명 전원 소집이 어려운 경우의 축소 구성.
      축소 사실과 구성을 리포트에 반드시 명시한다. 축소 결과를 '별표5 사용자 검증 통과'로
      표기하지 않는다.
    composition:
      - { type: "전맹시각장애인",   count: 1 }
      - { type: "저시력시각장애인", count: 1 }
      - { type: "휠체어사용자",     count: 1 }
      - { type: "고령자(65세 이상)", count: 2 }
      - { type: "비장애인(20~40대)", count: 2 }
    total_count: 7

# -----------------------------------------------------------------------------
# 별표5 3. 설계지침 면제 검증 기준
#   「행정사무정보처리용 무인민원발급기(KIOSK) 표준규격」 적합성평가를 통과하고
#   그 결과를 제출할 경우, 대응 항목을 통과한 것으로 인정한다.
# -----------------------------------------------------------------------------
exemptions:
  - id: 무인민원발급기_표준규격
    source: "「행정사무정보처리용 무인민원발급기(KIOSK) 표준규격」 차. 장애인 편의 기능"
    evidence_required: "적합성평가 통과 결과 제출"
    exempts: ["3.a", "3.b", "3.d", "3.h", "3.k", "9.a"]
    basis:
      - "2. 각 화면의 안내메시지는 청각장애인을 위해 별도의 안내 기능(자막 등)을 제공하여야 하며, 시각장애인용 음성안내 기능도 제공해야 한다."
      - "5. 음성지원시스템 이용자에 대한 이어폰 소켓을 제공하여야 한다."
      - "1. 시각장애인용 Keypad(0~9까지의 숫자버튼, '취소'/'정정'/'확인' 버튼 포함)를 부착 및 제공하여야 한다."
      - "6. 발급화면 하단에 '화면확대' 버튼을 제공하여 노인 및 저시력 사용자를 위한 별도의 발급화면으로 이동할 수 있어야 한다."
      - "3. 시각장애인용 장치들은 정해진 위치(오른쪽 또는 중앙)에 장착되어야 하며, 외부에서 도난, 파손의 우려가 없도록 견고하게 설치되어야 한다."
      - "4. 주요 조작부(키패드, 수수료 투입장치, 전자적 본인확인장치 등) 주변에 점자 표시(또는 점자라벨 부착 등)를 제공하여야 한다."
      - "7. 휠체어를 탄 사용자가 앉은 채로 사용할 수 있도록 바닥면에서 400mm 이상 1,220mm 이하로 작동부를 부착하여야 한다."
    note: >-
      공공 민원 단말 진단 시 이 경로를 먼저 확인한다. 적용되면 40항목 중 6항목이
      진단 범위에서 빠지고, 그중 3.a·3.d는 가장 비싼 SW 개선 항목이다.
